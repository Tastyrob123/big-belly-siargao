@font-face{font-family:"Montserrat";src:url(../website/assets/fonts/montserrat.woff2) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Instrument Sans";src:url(../website/assets/fonts/instrument.woff2) format("woff2");font-weight:400 700;font-display:block}
:root{--kohle:#121014;--karte:#1B181E;--pink:#FF2ACB;--pink-tief:#C8139C;--amber:#FFB23E;--weiss:#FFFDF9;--grau:#9A93A0}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--kohle);color:var(--weiss)}
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;font:400 16px/1.5 "Instrument Sans",system-ui,sans-serif;
  padding:max(20px,env(safe-area-inset-top)) clamp(16px,4vw,64px) max(20px,env(safe-area-inset-bottom))}
.kopf{width:100%;max-width:1360px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 0 clamp(18px,2.4vw,32px)}
.kopf img{height:clamp(40px,3.6vw,54px);width:auto;display:block}
.knopf{display:inline-flex;align-items:center;gap:12px;padding:7px 7px 7px 20px;border-radius:999px;text-decoration:none;white-space:nowrap;
  font:500 14px/1 "Montserrat",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#fff;
  background:linear-gradient(180deg,#FF52D6,var(--pink) 55%,#E21BB4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.16),0 14px 26px -14px rgba(255,42,203,.85),0 2px 4px -2px rgba(0,0,0,.3)}
.knopf i{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#fff,#FFE9F9);color:var(--pink-tief);
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.14),0 3px 6px -3px rgba(0,0,0,.4)}
.knopf svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
main{width:100%;max-width:1360px;flex:1;display:flex;flex-direction:column;justify-content:center}
.film{position:relative;width:100%;aspect-ratio:1920/1206;border-radius:clamp(14px,1.8vw,26px);overflow:hidden;background:var(--karte) url(poster.jpg?v=20261124) center/cover;
  box-shadow:0 0 0 1px rgba(255,42,203,.28),0 40px 70px -40px rgba(255,42,203,.45),0 2px 6px rgba(0,0,0,.4)}
.film video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;background:transparent}
.titel{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:clamp(18px,2vw,28px)}
.titel h1{margin:0;font:600 clamp(30px,4vw,60px)/1.05 "Montserrat",sans-serif;text-transform:uppercase;color:var(--pink)}
.titel h1 span{color:var(--amber)}
.titel p{margin:0;font-size:15px;color:var(--grau)}
footer{width:100%;max-width:1360px;padding-top:clamp(22px,3vw,40px);font-size:13px;color:#7D7584;text-align:center}
@media (max-width:700px){
  main{justify-content:center;padding-bottom:6vh}
  .film{width:calc(100% + 32px);margin:0 -16px;border-radius:0;box-shadow:none}
  .titel{margin-top:22px}
  .titel h1{font-size:clamp(32px,10vw,48px)}
  .titel p{font-size:16px}
  .knopf{padding:6px 6px 6px 14px;font-size:13px}
}
</style>

<script>
(function(){var v=document.querySelector('video');if(!v)return;
// läuft von selbst: stumm, im Bild, Endlosschleife; startet erneut, falls der Browser das automatische Abspielen zunächst anhält
function los(){var p=v.play();if(p&&p.catch)p.catch(function(){})}
v.addEventListener('loadeddata',los);document.addEventListener('visibilitychange',function(){if(!document.hidden)los()});
document.addEventListener('touchstart',los,{once:true,passive:true});})();
</script>
